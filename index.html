<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>FarBar 直式 4K 新聞看板</title>

<style>
  :root{
    --bg:#07111f;
    --panel:#0d1b2a;
    --panel2:#102338;
    --text:#f7f9fc;
    --muted:#aab7c4;
    --accent:#d71920;
    --line:rgba(255,255,255,.12);
  }

  *{
    box-sizing:border-box;
  }

  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",Arial,sans-serif;
  }

  body{
    display:flex;
    justify-content:center;
    align-items:center;
  }

  /* 以 2160 x 3840 的 9:16 直式畫面為基準 */
  .screen{
    width:100vw;
    height:100vh;
    display:grid;
    grid-template-rows: 10% 62% 18% 10%;
    background:
      radial-gradient(circle at 50% 0%, rgba(37,88,130,.28), transparent 35%),
      linear-gradient(180deg, #081522 0%, #07111f 100%);
  }

  .topbar{
    display:grid;
    grid-template-columns: 1fr auto;
    align-items:center;
    padding:0 4vw;
    border-bottom:1px solid var(--line);
    background:rgba(4,12,21,.92);
  }

  .brand{
    display:flex;
    flex-direction:column;
    gap:.35vh;
  }

  .brand .name{
    font-size:2.15vw;
    font-weight:800;
    letter-spacing:.03em;
  }

  .brand .sub{
    font-size:1.05vw;
    color:var(--muted);
    letter-spacing:.08em;
  }

  .clock{
    text-align:right;
    font-variant-numeric:tabular-nums;
  }

  #time{
    font-size:3.15vw;
    font-weight:800;
    line-height:1;
  }

  #date{
    margin-top:.7vh;
    font-size:1.05vw;
    color:var(--muted);
  }

  .video-section{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2.2vh 3.2vw;
  }

  .video-card{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    border:1px solid var(--line);
    background:#000;
    box-shadow:0 2vh 5vh rgba(0,0,0,.35);
    overflow:hidden;
    border-radius:1.2vw;
  }

  .video-titlebar{
    height:8%;
    min-height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 2.2vw;
    background:linear-gradient(90deg,#131f2d,#0d1722);
    border-bottom:1px solid var(--line);
  }

  .video-title{
    display:flex;
    align-items:center;
    gap:1vw;
    font-size:1.3vw;
    font-weight:700;
  }

  .live-dot{
    width:.75vw;
    height:.75vw;
    min-width:12px;
    min-height:12px;
    border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 0 .25vw rgba(215,25,32,.18);
  }

  .status{
    font-size:.9vw;
    color:var(--muted);
  }

  .player-wrap{
    flex:1;
    width:100%;
    position:relative;
    background:#000;
  }

  #player{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }

  .info-section{
    padding:1.5vh 4vw 1vh;
    display:grid;
    grid-template-columns:1.4fr .6fr;
    gap:2vw;
    align-items:center;
  }

  .headline{
    align-self:stretch;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:0 2vw;
    border-left:.32vw solid var(--accent);
    background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,0));
  }

  .headline .eyebrow{
    font-size:.95vw;
    color:#ff9094;
    font-weight:700;
    letter-spacing:.12em;
  }

  .headline .title{
    margin-top:.7vh;
    font-size:1.75vw;
    font-weight:800;
    line-height:1.3;
  }

  .headline .desc{
    margin-top:.7vh;
    font-size:1vw;
    color:var(--muted);
  }

  .sidebox{
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:0 1.6vw;
    border:1px solid var(--line);
    background:rgba(255,255,255,.035);
    border-radius:.8vw;
  }

  .sidebox .label{
    font-size:.85vw;
    color:var(--muted);
  }

  .sidebox .value{
    margin-top:.5vh;
    font-size:1.35vw;
    font-weight:800;
  }

  .ticker{
    display:grid;
    grid-template-columns:auto 1fr;
    align-items:center;
    border-top:1px solid var(--line);
    background:#050b12;
    overflow:hidden;
  }

  .ticker-label{
    height:100%;
    display:flex;
    align-items:center;
    padding:0 2vw;
    background:var(--accent);
    font-size:1.1vw;
    font-weight:800;
    letter-spacing:.08em;
    white-space:nowrap;
  }

  .ticker-window{
    overflow:hidden;
    position:relative;
    height:100%;
    display:flex;
    align-items:center;
  }

  .ticker-track{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    font-size:1.08vw;
    animation:ticker 34s linear infinite;
  }

  .ticker-track span{
    margin-right:5vw;
  }

  @keyframes ticker{
    from{ transform:translateX(0); }
    to{ transform:translateX(-100%); }
  }

  /* 低解析度預覽時仍可閱讀 */
  @media (max-width: 900px){
    .brand .name{font-size:4vw;}
    .brand .sub{font-size:2vw;}
    #time{font-size:5.6vw;}
    #date{font-size:2vw;}
    .video-title{font-size:2.2vw;}
    .status{font-size:1.7vw;}
    .headline .eyebrow{font-size:1.6vw;}
    .headline .title{font-size:2.7vw;}
    .headline .desc{font-size:1.7vw;}
    .sidebox .label{font-size:1.5vw;}
    .sidebox .value{font-size:2.2vw;}
    .ticker-label,.ticker-track{font-size:1.9vw;}
  }
</style>
</head>

<body>
  <main class="screen">
    <header class="topbar">
      <div class="brand">
        <div class="name">國際新聞即時直播</div>
        <div class="sub">LIVE NEWS DISPLAY · 2160 × 3840</div>
      </div>

      <div class="clock">
        <div id="time">00:00</div>
        <div id="date">----/--/--</div>
      </div>
    </header>

    <section class="video-section">
      <div class="video-card">
        <div class="video-titlebar">
          <div class="video-title">
            <span class="live-dot"></span>
            <span>BBC News / YouTube Live</span>
          </div>
          <div class="status" id="playerStatus">正在載入直播…</div>
        </div>
        <div class="player-wrap">
          <div id="player"></div>
        </div>
      </div>
    </section>

    <section class="info-section">
      <div class="headline">
        <div class="eyebrow">LIVE INFORMATION</div>
        <div class="title">即時國際新聞直播</div>
        <div class="desc">此頁面可直接作為 FarBar「網頁」內容網址使用。</div>
      </div>

      <div class="sidebox">
        <div class="label">播放器設定</div>
        <div class="value">自動播放 · 音量 50%</div>
      </div>
    </section>

    <footer class="ticker">
      <div class="ticker-label">NEWS</div>
      <div class="ticker-window">
        <div class="ticker-track" id="tickerTrack">
          <span>歡迎使用 FarBar 直式 4K 新聞展示頁</span>
          <span>本頁使用 YouTube IFrame Player API</span>
          <span>如瀏覽器限制有聲自動播放，播放器可能先以靜音方式啟動</span>
          <span>可直接修改下方 JavaScript 中的影片 ID 與跑馬燈文字</span>
        </div>
      </div>
    </footer>
  </main>

<script>
  /* ===== 時鐘 ===== */
  function updateClock(){
    const now = new Date();

    const time = new Intl.DateTimeFormat('zh-TW', {
      hour:'2-digit',
      minute:'2-digit',
      hour12:false
    }).format(now);

    const date = new Intl.DateTimeFormat('zh-TW', {
      year:'numeric',
      month:'2-digit',
      day:'2-digit',
      weekday:'long'
    }).format(now);

    document.getElementById('time').textContent = time;
    document.getElementById('date').textContent = date;
  }

  updateClock();
  setInterval(updateClock, 1000);

  /* ===== YouTube 直播 =====
     要更換影片，只需要修改下面這個 ID：
     https://www.youtube.com/watch?v=b3NmhxUDt-4
     影片 ID = b3NmhxUDt-4
  */
  const YOUTUBE_VIDEO_ID = 'b3NmhxUDt-4';

  let player;

  function onYouTubeIframeAPIReady(){
    player = new YT.Player('player', {
      videoId: YOUTUBE_VIDEO_ID,
      width: '100%',
      height: '100%',
      playerVars: {
        autoplay: 1,
        controls: 0,
        rel: 0,
        playsinline: 1,
        modestbranding: 1,
        fs: 0,
        iv_load_policy: 3
      },
      events: {
        onReady: function(event){
          const p = event.target;

          // 先設定 50% 音量
          p.setVolume(50);

          // 直接嘗試有聲自動播放
          try {
            p.unMute();
            p.playVideo();
          } catch(e) {}

          // 部分 Chrome / Android WebView 會阻擋「有聲自動播放」。
          // 若被阻擋，先靜音播放，之後再嘗試恢復 50% 音量。
          setTimeout(function(){
            try {
              const state = p.getPlayerState();
              if(state !== YT.PlayerState.PLAYING){
                p.mute();
                p.playVideo();
              }

              setTimeout(function(){
                try{
                  p.setVolume(50);
                  p.unMute();
                }catch(e){}
              }, 1800);
            } catch(e) {}
          }, 1500);

          document.getElementById('playerStatus').textContent = 'LIVE · 音量設定 50%';
        },

        onStateChange: function(event){
          const status = document.getElementById('playerStatus');

          if(event.data === YT.PlayerState.PLAYING){
            status.textContent = 'LIVE · 播放中';
          }else if(event.data === YT.PlayerState.BUFFERING){
            status.textContent = '直播緩衝中…';
          }else if(event.data === YT.PlayerState.ENDED){
            status.textContent = '直播已結束';
          }
        },

        onError: function(){
          document.getElementById('playerStatus').textContent =
            '無法載入直播，請確認影片是否允許嵌入';
        }
      }
    });
  }

  /* 載入 YouTube IFrame API */
  (function(){
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  })();
</script>
</body>
</html>
