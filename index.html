<!DOCTYPE html>
<html lang="zh-Hant">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>城市觀察｜URBAN PERSPECTIVES</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
}

/* 整個直式畫面 */
.screen {
    width: 100vw;
    height: 100vh;
    background: #000;
    display: flex;
    flex-direction: column;
}

/* 上方 */
header {
    height: 16%;
    padding: 0 5vw;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: #000;
}

.title h1 {
    margin: 0;
    font-size: 2.8vw;
    font-weight: 700;
    letter-spacing: .05em;
}

.title p {
    margin: .6vh 0 0;
    font-size: 1vw;
    letter-spacing: .18em;
    color: #aaa;
}

.clock {
    text-align: right;
}

#time {
    font-size: 2.8vw;
    font-weight: 600;
}

#date {
    margin-top: .5vh;
    font-size: 1vw;
    color: #aaa;
}


/* YouTube 區域 */
.video-area {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

/*
  保持影片原始 16:9
  不裁切、不拉伸
*/
.video-container {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
}

#player {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;
}


/* 下方黑色留白 */
.bottom {
    flex: 1;

    display: flex;
    align-items: flex-end;

    padding: 0 5vw 5vh;

    background: #000;
}

.tags {
    font-size: 1vw;
    letter-spacing: .12em;
    color: #aaa;
}

.tags span {
    margin: 0 .8vw;
    color: #555;
}
</style>
</head>


<body>

<main class="screen">

<header>

    <div class="title">
        <h1>城市觀察</h1>
        <p>URBAN PERSPECTIVES</p>
    </div>

    <div class="clock">
        <div id="time">00:00</div>
        <div id="date"></div>
    </div>

</header>


<section class="video-area">

    <div class="video-container">
        <div id="player"></div>
    </div>

</section>


<section class="bottom">

    <div class="tags">
        城市
        <span>·</span>
        發展
        <span>·</span>
        交通
        <span>·</span>
        環境
        <span>·</span>
        全球議題
    </div>

</section>

</main>


<script>

/* 時間 */

function updateClock() {

    const now = new Date();

    document.getElementById("time").textContent =
        new Intl.DateTimeFormat("zh-TW", {
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
        }).format(now);

    document.getElementById("date").textContent =
        new Intl.DateTimeFormat("zh-TW", {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            weekday: "short"
        }).format(now);
}

updateClock();
setInterval(updateClock, 1000);


/* YouTube */

const VIDEO_ID = "b3NmhxUDt-4";

let player;

function onYouTubeIframeAPIReady() {

    player = new YT.Player("player", {

        videoId: VIDEO_ID,

        playerVars: {
            autoplay: 1,

            /* 靜音才能讓自動播放最穩定 */
            mute: 1,

            controls: 0,
            rel: 0,
            playsinline: 1,
            modestbranding: 1,
            iv_load_policy: 3
        },

        events: {

            onReady: function(event) {

                event.target.mute();
                event.target.playVideo();

            }

        }

    });

}


/* 載入 YouTube API */

const tag = document.createElement("script");

tag.src = "https://www.youtube.com/iframe_api";

document.head.appendChild(tag);

</script>

</body>
</html>
