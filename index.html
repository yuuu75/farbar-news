<!DOCTYPE html>
<html lang="zh-Hant">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>城市觀察｜URBAN PERSPECTIVES</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #f5f5f5;
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    color: #111;
}

.screen {
    width: 100vw;
    height: 100vh;
    display: grid;
    grid-template-rows: 13% 77% 10%;
}

/* ---------- 標題 ---------- */

header {
    background: #fff;
    padding: 0 5vw;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #ddd;
}

.title h1 {
    margin: 0;
    font-size: 2.7vw;
    font-weight: 800;
    letter-spacing: .05em;
}

.title p {
    margin: .5vh 0 0;
    font-size: 1vw;
    letter-spacing: .18em;
    color: #666;
}

.clock {
    text-align: right;
}

#time {
    font-size: 2.8vw;
    font-weight: 700;
}

#date {
    margin-top: .5vh;
    font-size: 1vw;
    color: #777;
}

/* ---------- 直播 ---------- */

.video {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
}

#player {
    width: 100%;
    height: 100%;
}

/* ---------- 底部 ---------- */

footer {
    background: #fff;
    display: flex;
    align-items: center;
    padding: 0 5vw;
    border-top: 1px solid #ddd;
}

.tag {
    font-size: 1.15vw;
    font-weight: 600;
    letter-spacing: .08em;
}

.tag span {
    color: #777;
    margin: 0 .8vw;
}
</style>
</head>

<body>

<main class="screen">

<header>

    <div class="title">
        <h1>城市觀察</h1>
        <p>URBAN PERSPECTIVES</p>
    </div>

    <div class="clock">
        <div id="time">00:00</div>
        <div id="date"></div>
    </div>

</header>


<section class="video">
    <div id="player"></div>
</section>


<footer>

    <div class="tag">
        城市
        <span>·</span>
        發展
        <span>·</span>
        交通
        <span>·</span>
        環境
        <span>·</span>
        全球議題
    </div>

</footer>

</main>


<script>

/* ---------- 時間 ---------- */

function updateClock() {

    const now = new Date();

    document.getElementById("time").textContent =
        new Intl.DateTimeFormat("zh-TW", {
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
        }).format(now);

    document.getElementById("date").textContent =
        new Intl.DateTimeFormat("zh-TW", {
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            weekday: "short"
        }).format(now);
}

updateClock();
setInterval(updateClock, 1000);


/* ---------- YouTube ---------- */

const VIDEO_ID = "b3NmhxUDt-4";

let player;

function onYouTubeIframeAPIReady() {

    player = new YT.Player("player", {

        videoId: VIDEO_ID,

        playerVars: {
            autoplay: 1,
            controls: 0,
            rel: 0,
            playsinline: 1,
            modestbranding: 1,
            iv_load_policy: 3
        },

        events: {

            onReady: function(event) {

                const player = event.target;

                player.setVolume(50);
                player.playVideo();

            }

        }

    });

}


/* 載入 YouTube API */

const tag = document.createElement("script");

tag.src = "https://www.youtube.com/iframe_api";

document.head.appendChild(tag);

</script>

</body>
</html>
